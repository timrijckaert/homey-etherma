name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  main:
    name: Test & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate Homey app
        # Alpha validates at `publish` (what the app passes today). Before a public
        # App Store release, bump this to `verified` — the strictest tier — and fix
        # whatever it flags (store metadata, changelog, real marketing art, etc.).
        uses: athombv/github-action-homey-app-validate@master
        with:
          level: publish
